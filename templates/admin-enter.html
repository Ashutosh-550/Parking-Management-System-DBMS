<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login - Parking Management System</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f7f6;
        }

        .bg-image-container {
            background-image: url("{{ url_for('static', filename='parking_bgp5.jpg') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .centered-container {
            background: rgb(255, 255, 255);
            padding: 40px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            text-align: left;
        }

        .centered-container h1 {
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
        }

        .centered-container input[type="text"], 
        .centered-container input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .centered-container button {
            background-color: #0f4c81;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        .centered-container button:hover {
            background-color: #1b6ca8;
        }

        .centered-container .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #0f4c81;
            text-decoration: none;
            font-weight: 600;
        }

        .centered-container .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="bg-image-container">
    <div class="centered-container">
    <h1>Admin Login</h1>

    <form action="admin-dashboard.html" method="POST">
        <div>
            <label for="username">Username:</label><br>
            <input type="text" id="username" name="username" required>
        </div>
        <br>
        <div>
            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password" required>
        </div>
        <br>
        <div>
            <button type="submit">Login</button>
        </div>
    </form>

    <br>
    <p>
        <a href="login.html">Back to Main Dashboard</a>
    </p>
</div>
</div>
</body>
</html>
